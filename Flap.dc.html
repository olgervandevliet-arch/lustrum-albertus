<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div ref="{{ rootRef }}" style="position: relative; width: 100%; height: 100%; border-radius: 14px; background: #FFFFFF; box-shadow: 0 1px 0 rgba(255,255,255,0.9) inset; perspective: 700px;">
  <div style="position: absolute; left: 0; right: 0; top: 0; height: 50%; overflow: hidden; border-radius: 14px 14px 0 0; background: #FFFFFF;">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 200%; display: grid; place-items: center; color: #12131A; font-weight: 500; line-height: 1;">{{ upper }}</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 50%; overflow: hidden; border-radius: 0 0 14px 14px; background: #FAFBFD;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200%; display: grid; place-items: center; color: #12131A; font-weight: 500; line-height: 1;">{{ lower }}</div>
  </div>
  <div data-leaf-top="1" style="position: absolute; left: 0; right: 0; top: 0; height: 50%; overflow: hidden; border-radius: 14px 14px 0 0; background: #FFFFFF; transform-origin: 50% 100%; backface-visibility: hidden; z-index: 3; visibility: {{ leafVisibility }}; will-change: transform;">
    <div style="position: absolute; left: 0; right: 0; top: 0; height: 200%; display: grid; place-items: center; color: #12131A; font-weight: 500; line-height: 1;">{{ leafTop }}</div>
  </div>
  <div data-leaf-bottom="1" style="position: absolute; left: 0; right: 0; bottom: 0; height: 50%; overflow: hidden; border-radius: 0 0 14px 14px; background: #FAFBFD; transform-origin: 50% 0%; backface-visibility: hidden; z-index: 3; transform: rotateX(90deg); visibility: {{ leafVisibility }}; will-change: transform;">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 200%; display: grid; place-items: center; color: #12131A; font-weight: 500; line-height: 1;">{{ leafBottom }}</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; z-index: 4; background: linear-gradient(180deg, rgba(18,28,60,0.16), rgba(255,255,255,0.85));"></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:180},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;7&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.rootRef = React.createRef();
    this.state = { shown: null, flip: null };
  }

  componentDidMount() {
    this.setState({ shown: String(this.props.value ?? '0') });
  }

  componentDidUpdate(prevProps) {
    const next = String(this.props.value ?? '0');
    const before = String(prevProps.value ?? next);
    if (before === next) return;
    if (this.props.instant) {
      this.setState({ flip: null, shown: next });
      return;
    }
    if (!this.animating) this.animate(before, next);
  }

  animate(from, to) {
    this.animating = true;
    const g = window.gsap;
    const root = this.rootRef.current;
    const top = root && root.querySelector('[data-leaf-top]');
    const bottom = root && root.querySelector('[data-leaf-bottom]');
    const finish = () => {
      this.animating = false;
      this.setState({ flip: null, shown: to });
    };
    if (!g || !top || !bottom) return finish();
    this.setState({ flip: { from, to } }, () => {
      g.set(top, { rotateX: 0 });
      g.set(bottom, { rotateX: 90 });
      g.timeline({ onComplete: finish })
        .to(top, { rotateX: -90, duration: 0.3, ease: 'power2.in' }, 0)
        .to(bottom, { rotateX: 0, duration: 0.34, ease: 'power2.out' }, 0.3);
    });
  }

  renderVals() {
    const value = String(this.props.value ?? '0');
    const shown = this.state.shown ?? value;
    const flip = this.state.flip;
    return {
      rootRef: this.rootRef,
      leafVisibility: flip ? 'visible' : 'hidden',
      upper: flip ? flip.to : shown,
      lower: flip ? flip.from : shown,
      leafTop: flip ? flip.from : shown,
      leafBottom: flip ? flip.to : shown,
    };
  }
}

</script>
</body>
</html>

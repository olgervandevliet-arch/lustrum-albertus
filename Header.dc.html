<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
  @media (max-width: 600px) {
    [data-logo-label] { display: none; }
  }
</style>
</helmet>
<div style="font-family: 'Inter', system-ui, sans-serif;">
  <sc-if value="{{ barOpen }}" hint-placeholder-val="{{ true }}">
    <div ref="{{ barRef }}" style="position: relative; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px 8px; background: #3B4C99; color: #DCEAFF; font-size: clamp(12px, 3vw, 14px); font-weight: 500; letter-spacing: 0.005em; padding: 12px clamp(40px, 10vw, 56px); text-align: center; border-bottom: 1px solid #677BC0">
      <span>Volg ons op Instagram voor de laatste updates.</span>
      <a href="https://www.instagram.com/lustrumalbertus/" style="color: #FFFFFF; text-decoration: underline; text-underline-offset: 3px; font-weight: 600;">Naar instagram &gt;</a>
      <button type="button" onClick="{{ closeBar }}" aria-label="Sluiten" style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; display: grid; place-items: center; background: transparent; border: 0; cursor: pointer; color: #DCEAFF; font-size: 18px; line-height: 1; padding: 0;" style-hover="color: #FFFFFF;"><i class="ph ph-x"></i></button>
    </div>
  </sc-if>
  <div style="position: fixed; top: 0; left: 0; width: 100%; z-index: 80; display: flex; justify-content: center; padding: 18px 4vw 0; padding-top: {{ pillTop }}; box-sizing: border-box; transform: {{ headerTransform }}; transition: transform 0.4s ease, padding-top 0.3s ease;">
    <div ref="{{ navRef }}" onMouseEnter="{{ onHoverOpen }}" onMouseLeave="{{ onHoverClose }}" style="display: flex; flex-direction: column; height: 64px; border-radius: 999px; background: linear-gradient(180deg, rgba(20,30,70,0.42), rgba(20,30,70,0.28)); border: 1px solid rgba(255,255,255,0.16); backdrop-filter: blur(20px) saturate(140%); -webkit-backdrop-filter: blur(20px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.18); width: min(400px, 92vw); overflow: hidden; will-change: height, width; border-radius: {{ pillRadius }};">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: clamp(10px, 2vw, 24px); height: 64px; flex: 0 0 64px; padding: 0 clamp(16px, 4vw, 26px); padding-left: clamp(24px, 4vw, 32px); padding-right: clamp(24px, 4vw, 32px)">
        <a href="/" onClick="{{ onLogoClick }}" data-pt-link="1" style="display: flex; align-items: center; gap: 9px; color: #FFFFFF; text-decoration: none; flex: 0 0 auto;">
          <span data-logo-label="1" style="display: block; font-family: 'Inter Tight', sans-serif; font-size: 13px; font-weight: 600; line-height: 1.12; letter-spacing: 0.01em; text-align: right; opacity: 0.95; white-space: nowrap;">Lustrum<br>Albertus</span>
          <span style="font-family: 'Inter Tight', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.01em; line-height: 1;">XXVI</span>
        </a>
        <nav style="display: flex; align-items: center; gap: clamp(8px, 1.6vw, 22px); flex: {{ navFlex }}; min-width: 0; justify-content: center; opacity: {{ navOpacity }}; white-space: nowrap; overflow: visible;">
          <div ref="{{ infoRef }}" onMouseEnter="{{ onInfoOpen }}" onMouseLeave="{{ onInfoClose }}" style="position: relative;">
            <span style="display: flex; align-items: center; gap: 4px; color: #FFFFFF; font-size: clamp(12px, 2.2vw, 14px); font-weight: 500; cursor: default;">Informatie <i class="ph ph-caret-down" style="font-size: 12px; transition: transform 0.2s ease; transform: {{ infoCaretTransform }};"></i></span>
          </div>
          <a href="Partners.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: clamp(12px, 2.2vw, 14px); font-weight: 500;" style-hover="opacity: 0.75;">Partners</a>
          <a href="FAQ.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: clamp(12px, 2.2vw, 14px); font-weight: 500;" style-hover="opacity: 0.75;">FAQ</a>
          <a href="Contact.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: clamp(12px, 2.2vw, 14px); font-weight: 500;" style-hover="opacity: 0.75;">Contact</a>
          <a href="https://www.instagram.com/lustrumalbertus/" aria-label="Instagram" style="display: grid; place-items: center; width: 26px; height: 26px; color: #FFFFFF; flex: 0 0 auto; font-size: 20px; text-decoration: none;" style-hover="opacity: 0.75;">
            <i class="ph ph-instagram-logo"></i>
          </a>
        </nav>
        <button type="button" aria-label="Menu" onClick="{{ toggleOpen }}" style="position: relative; display: grid; place-items: center; width: 32px; height: 44px; padding: 0; background: transparent; border: 0; cursor: pointer; flex: 0 0 auto; color: #FFFFFF; font-size: 26px;" style-hover="opacity: 0.7;">
          <i class="ph ph-list" style="position: absolute; transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1); transform: {{ hamburgerTransform }};"></i>
          <i class="ph ph-x" style="position: absolute; transition: transform 0.4s cubic-bezier(0.65, 0, 0.35, 1); transform: {{ closeTransform }};"></i>
        </button>
      </div>
      <div ref="{{ listRef }}" style="display: flex; flex-direction: column; border-top: 1px solid rgba(255,255,255,0.22); opacity: {{ mobileOpen }}; transition: opacity 0.35s ease;">
        <button type="button" onClick="{{ toggleMobileInfo }}" style="display: flex; align-items: center; justify-content: space-between; padding: 18px clamp(28px, 7vw, 40px) 18px clamp(24px, 6vw, 34px); color: #FFFFFF; background: transparent; border: 0; width: 100%; text-align: left; cursor: pointer; font-family: 'Inter Tight', sans-serif; font-size: clamp(16px, 4.2vw, 19px); font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.14);">
          <span>Informatie</span>
          <i class="ph ph-caret-down" style="transition: transform 0.25s ease; transform: {{ mobileInfoCaretTransform }};"></i>
        </button>
        <sc-if value="{{ mobileInfoOpen }}" hint-placeholder-val="{{ false }}">
          <sc-for list="{{ infoItems }}" as="item" hint-placeholder-count="4">
            <a href="{{ item.href }}" style="display: flex; align-items: center; justify-content: space-between; padding: 14px clamp(28px, 7vw, 40px) 14px clamp(40px, 10vw, 52px); color: #DCEAFF; text-decoration: none; font-family: 'Inter Tight', sans-serif; font-size: clamp(14px, 3.8vw, 17px); font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.1);" style-hover="opacity: 0.8;">
              <span>{{ item.label }}</span>
              <i class="ph ph-arrow-right" aria-hidden="true"></i>
            </a>
          </sc-for>
        </sc-if>
        <sc-for list="{{ mobileItems }}" as="item" hint-placeholder-count="3">
          <a href="{{ item.href }}" style="display: flex; align-items: center; justify-content: space-between; padding: 18px clamp(28px, 7vw, 40px) 18px clamp(24px, 6vw, 34px); color: #FFFFFF; text-decoration: none; font-family: 'Inter Tight', sans-serif; font-size: clamp(16px, 4.2vw, 19px); font-weight: 500; border-bottom: 1px solid rgba(255,255,255,0.14);" style-hover="opacity: 0.8;">
            <span>{{ item.label }}</span>
            <i class="ph ph-arrow-right" aria-hidden="true"></i>
          </a>
        </sc-for>
        <a href="https://www.instagram.com/lustrumalbertus/" style="display: flex; align-items: center; gap: 10px; padding: 18px clamp(28px, 7vw, 40px) 22px clamp(24px, 6vw, 34px); color: #FFFFFF; text-decoration: none; font-family: 'Inter Tight', sans-serif; font-size: clamp(16px, 4.2vw, 19px); font-weight: 500;" style-hover="opacity: 0.8;">
          <i class="ph-bold ph-instagram-logo"></i>
          <span>Volg ons op Instagram</span>
        </a>
      </div>
    </div>
    <div onMouseEnter="{{ onInfoOpen }}" onMouseLeave="{{ onInfoClose }}" style="position: fixed; left: {{ infoMenuLeft }}; top: {{ infoMenuTop }}; transform: translateX(-50%) {{ infoMenuSlide }}; min-width: 170px; border-radius: 14px; background: linear-gradient(180deg, rgba(20,30,70,0.94), rgba(20,30,70,0.9)); border: 1px solid rgba(255,255,255,0.16); backdrop-filter: blur(20px); padding: 8px; display: flex; flex-direction: column; opacity: {{ infoMenuOpacity }}; pointer-events: {{ infoMenuPointer }}; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 90;">
      <a href="Pakketten.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 8px;" style-hover="background: rgba(255,255,255,0.1);">Pakketten</a>
      <a href="Programma.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 8px;" style-hover="background: rgba(255,255,255,0.1);">Programma</a>
      <a href="Thema.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 8px;" style-hover="background: rgba(255,255,255,0.1);">Thema</a>
      <a href="Terrein.dc.html" style="color: #FFFFFF; text-decoration: none; font-size: 14px; font-weight: 500; padding: 9px 12px; border-radius: 8px;" style-hover="background: rgba(255,255,255,0.1);">Terrein</a>
    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:160},&quot;showAnnouncement&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.navRef = React.createRef();
    this.listRef = React.createRef();
    this.barRef = React.createRef();
    this.infoRef = React.createRef();
    this.state = { closed: false, open: false, hidden: false, barHeight: 0, compact: false, infoOpen: false, mobileInfoOpen: false, infoMenuLeft: '0px', infoMenuTop: '0px' };
    this.lastScrollY = 0;
  }

  componentDidMount() {
    this.lastScrollY = window.scrollY;
    window.addEventListener('scroll', this.onScroll, { passive: true });
    this.measureBar();
    window.addEventListener('resize', this.measureBar);
    // beginbreedte wordt hier gezet; daarna is de gsap-tween de enige die width aanpast,
    // zodat een re-render de bouncy animatie niet meer overschrijft
    const el = this.navRef.current;
    if (el) el.style.width = Math.min(this.isMobile() ? 240 : 400, window.innerWidth * 0.92) + 'px';
  }

  componentDidUpdate(prevProps, prevState) {
    if (prevState.closed !== this.state.closed) this.measureBar();
  }

  componentWillUnmount() {
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.measureBar);
  }

  measureBar = () => {
    const h = this.barRef.current ? this.barRef.current.offsetHeight : 0;
    if (h !== this.state.barHeight) this.setState({ barHeight: h });
  };

  onScroll = () => {
    const y = window.scrollY;
    if (this.state.open) { this.lastScrollY = y; return; }
    const barGone = y > this.state.barHeight + 40;
    const goingDown = y > this.lastScrollY + 4;
    const goingUp = y < this.lastScrollY - 4;
    if (goingDown && y > 120 && !this.state.hidden) this.setState({ hidden: true });
    else if (goingUp && this.state.hidden) this.setState({ hidden: false, compact: barGone });
    else if (y <= 120 && this.state.hidden) this.setState({ hidden: false, compact: barGone });
    else if (!this.state.hidden) this.setState({ compact: barGone });
    this.lastScrollY = y;
  };

  isMobile = () => window.matchMedia('(hover: none), (max-width: 900px)').matches;

  onInfoOpen = () => {
    // submenu rendert los van de pill (die overflow: hidden heeft voor de mobiele accordion-animatie),
    // dus positie wordt gemeten en als position: fixed toegepast zodat hij nooit wordt afgesneden
    const r = this.infoRef.current ? this.infoRef.current.getBoundingClientRect() : null;
    this.setState({
      infoOpen: true,
      infoMenuLeft: (r ? r.left + r.width / 2 : 0) + 'px',
      infoMenuTop: (r ? r.bottom + 12 : 0) + 'px',
    });
  };
  onInfoClose = () => this.setState({ infoOpen: false });
  toggleMobileInfo = () => {
    this.setState((s) => ({ mobileInfoOpen: !s.mobileInfoOpen }), () => this.animate());
  };

  onLogoClick = (e) => {
    e.preventDefault();
    if (window.__pageTransition) window.__pageTransition.go('/');
    else window.location.href = '/';
  };

  toggleOpen = () => {
    this.setState((s) => ({ open: !s.open }), () => this.animate());
  };

  onHoverOpen = () => {
    if (this.isMobile() || this.state.open) return;
    this.setState({ open: true }, () => this.animate());
  };

  onHoverClose = () => {
    if (this.isMobile() || !this.state.open) return;
    this.setState({ open: false }, () => this.animate());
  };

  animate() {
    const el = this.navRef.current;
    if (!el || !window.gsap) return;
    const gsap = window.gsap;
    if (this.isMobile()) {
      gsap.killTweensOf(el);
      const listH = this.listRef.current ? this.listRef.current.scrollHeight : 0;
      gsap.set(el, { borderRadius: 32 });
      if (this.state.open && !this.listRef.current) return;
      if (this.state.open) {
        gsap.to(el, { height: 64 + listH, width: Math.min(400, window.innerWidth * 0.92), duration: 0.85, ease: 'elastic.out(1, 0.55)' });
      } else {
        gsap.to(el, { height: 64, width: Math.min(240, window.innerWidth * 0.92), duration: 0.7, ease: 'elastic.out(1, 0.6)' });
      }
      return;
    }
    if (this.state.open) {
      const full = Math.min(window.innerWidth * 0.94, 1040);
      gsap.to(el, { width: full, duration: 0.75, ease: 'elastic.out(1, 0.65)' });
    } else {
      const closed = Math.min(400, window.innerWidth * 0.92);
      gsap.to(el, { width: closed, duration: 0.6, ease: 'elastic.out(1, 0.75)' });
    }
  }

  renderVals() {
    const on = (this.props.showAnnouncement ?? true) && !this.state.closed;
    const open = this.state.open;
    const mobile = this.isMobile();
    const desktopOpen = open && !mobile;
    const mobileOpen = open && mobile;
    return {
      barOpen: on,
      closeBar: () => this.setState({ closed: true }),
      navRef: this.navRef,
      listRef: this.listRef,
      toggleOpen: this.toggleOpen,
      onLogoClick: this.onLogoClick,
      barRef: this.barRef,
      pillTop: (this.state.compact ? 24 : this.state.barHeight + 24) + 'px',
      onHoverOpen: this.onHoverOpen,
      onHoverClose: this.onHoverClose,
      navOpacity: desktopOpen ? 1 : 0,
      navFlex: desktopOpen ? '1 1 auto' : '0 0 0px',
      desktopOpen,
      mobileOpen: mobileOpen ? 1 : 0,
      pillRadius: mobile ? '32px' : '999px',
      headerTransform: this.state.hidden ? 'translateY(-130%)' : 'translateY(0)',
      hamburgerTransform: open ? 'rotate(180deg) scale(0)' : 'rotate(0deg) scale(1)',
      closeTransform: open ? 'rotate(0deg) scale(1)' : 'rotate(-180deg) scale(0)',
      infoRef: this.infoRef,
      infoCaretTransform: this.state.infoOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      infoMenuOpacity: this.state.infoOpen ? 1 : 0,
      infoMenuPointer: this.state.infoOpen ? 'auto' : 'none',
      infoMenuLeft: this.state.infoMenuLeft,
      infoMenuTop: this.state.infoMenuTop,
      infoMenuSlide: this.state.infoOpen ? 'translateY(0)' : 'translateY(-6px)',
      mobileInfoOpen: this.state.mobileInfoOpen,
      mobileInfoCaretTransform: this.state.mobileInfoOpen ? 'rotate(180deg)' : 'rotate(0deg)',
      infoItems: [
        { label: 'Pakketten', href: 'Pakketten.dc.html' },
        { label: 'Programma', href: 'Programma.dc.html' },
        { label: 'Thema', href: 'Thema.dc.html' },
        { label: 'Terrein', href: 'Terrein.dc.html' },
      ],
      mobileItems: [
        { label: 'Partners', href: 'Partners.dc.html' },
        { label: 'FAQ', href: 'FAQ.dc.html' },
        { label: 'Contact', href: 'Contact.dc.html' },
      ],
    };
  }
}

</script>
</body>
</html>
